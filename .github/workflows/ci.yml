name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GestorTareas.sln --configfile NuGet.Config
      - run: dotnet test GestorTareas.sln --no-restore --configuration Release
      - run: dotnet publish gestor-tareas-api/GestorTareas.Api.csproj --no-restore --configuration Release

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestor-tareas-spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gestor-tareas-spa/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=moderate
